<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEDSign Studio v5.0 — Integrated LED Neon Sign Generator</title>
    <style>
        :root {
            --bg-color: #0b0d12;
            --panel-bg: #141720;
            --border-color: #232836;
            --accent-color: #00f2fe;
            --accent-gradient: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            --text-main: #f0f2f5;
            --text-muted: #8c94a6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { display: flex; height: 100vh; background-color: var(--bg-color); color: var(--text-main); overflow: hidden; }

        /* Sidebar Control Panel */
        #sidebar {
            width: 450px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 4px 0 25px rgba(0,0,0,0.6);
        }

        .header { padding: 18px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.25rem; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

        /* Unit Switcher */
        .unit-toggle {
            display: flex;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }
        .unit-btn {
            padding: 5px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            border: none;
            background: transparent;
            cursor: pointer;
            transition: all 0.2s;
        }
        .unit-btn.active {
            background: var(--accent-color);
            color: #000;
        }

        .controls-container { flex: 1; overflow-y: auto; padding: 20px; }
        
        .section-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent-color); margin: 18px 0 10px 0; font-weight: 700; }
        .section-title:first-child { margin-top: 0; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.82rem; color: var(--text-main); margin-bottom: 5px; font-weight: 500; }
        .form-group label span { float: right; color: var(--text-muted); font-weight: normal; }

        textarea, select, input[type="number"], input[type="text"] {
            width: 100%; padding: 9px 11px; background: var(--bg-color); border: 1px solid var(--border-color);
            border-radius: 6px; color: #fff; font-size: 0.88rem; transition: border 0.2s; resize: vertical;
        }
        textarea:focus, select:focus, input[type="number"]:focus { border-color: var(--accent-color); outline: none; }

        input[type="range"] {
            width: 100%; -webkit-appearance: none; background: var(--bg-color); height: 6px; border-radius: 3px; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent-color); cursor: pointer;
        }

        .checkbox-group { display: flex; align-items: center; justify-content: space-between; }
        .checkbox-group input { width: 18px; height: 18px; accent-color: var(--accent-color); cursor: pointer; }

        .color-picker-group { display: flex; gap: 10px; align-items: center; }
        .color-picker-group input[type="color"] { -webkit-appearance: none; border: none; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; background: transparent; }
        .color-picker-group input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        .color-picker-group input[type="color"]::-webkit-color-swatch { border: 2px solid var(--border-color); border-radius: 50%; }

        /* Action Buttons */
        .actions { padding: 18px; border-top: 1px solid var(--border-color); display: flex; gap: 10px; }
        .btn {
            flex: 1; padding: 11px; border: none; border-radius: 6px; font-weight: 600; font-size: 0.85rem;
            cursor: pointer; transition: all 0.2s ease; display: flex; justify-content: center; align-items: center; gap: 6px;
        }
        .btn-primary { background: var(--accent-gradient); color: #fff; box-shadow: 0 4px 15px rgba(0,198,255,0.25); }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-secondary { background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: var(--border-color); }

        /* 3D Viewport */
        #viewport { flex: 1; position: relative; background: radial-gradient(circle at center, #1b2030 0%, #080a0f 100%); }
        #canvas-container { width: 100%; height: 100%; }

        /* Overlay Info */
        .viewport-overlay {
            position: absolute; bottom: 20px; right: 20px; background: rgba(20, 23, 32, 0.85);
            backdrop-filter: blur(8px); padding: 10px 16px; border-radius: 8px; border: 1px solid var(--border-color);
            font-size: 0.78rem; color: var(--text-muted); pointer-events: none;
        }
        .viewport-overlay strong { color: var(--text-main); }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">
            <div>
                <h1>LEDSign Studio</h1>
                <p>Integrated LED Neon Sign Generator</p>
            </div>
            <div class="unit-toggle">
                <button class="unit-btn active" id="unit-mm" onclick="setUnits('mm')">mm</button>
                <button class="unit-btn" id="unit-in" onclick="setUnits('in')">in</button>
            </div>
        </div>

        <div class="controls-container">
            <div class="section-title">1. Sign Dimensions & Base Shape</div>
            <div class="form-group">
                <label for="sign-width">Sign Target Width <span id="val-sign-width">400 mm</span></label>
                <input type="number" id="sign-width" value="400" min="50" max="5000" step="10">
            </div>
            <div class="form-group">
                <label for="base-shape">Backplate Shape Style</label>
                <select id="base-shape">
                    <option value="contour" selected>Contour / Outline Cut</option>
                    <option value="rounded">Rounded Box Plate</option>
                    <option value="ellipse">Circle / Ellipse Plate</option>
                    <option value="shield">Shield / Badge Style</option>
                    <option value="hexagon">Geometric Hexagon</option>
                </select>
            </div>

            <div class="section-title">2. Text & Neon Fonts</div>
            <div class="form-group">
                <label for="text-input">Sign Text (Multi-Line)</label>
                <textarea id="text-input" rows="2">NEON
SIGN</textarea>
            </div>
            <div class="form-group">
                <label for="font-family">NeonSignsNow Font Collection</label>
                <select id="font-family">
                    <optgroup label="Cursive & Neon Script">
                        <option value="pacifico" selected>Barcelona Script (Pacifico Style)</option>
                        <option value="caveat">Monaco Handwritten (Caveat Style)</option>
                        <option value="greatvibes">Venice Elegant (Great Vibes)</option>
                    </optgroup>
                    <optgroup label="Modern & Bold Sans">
                        <option value="helvetiker">Neonite Clean Bold</option>
                        <option value="optimer">Bayside Tech Sans</option>
                    </optgroup>
                </select>
            </div>
            <div class="form-group">
                <label for="line-height">Line Spacing / Height <span id="val-line-height">1.3x</span></label>
                <input type="range" id="line-height" min="0.8" max="2.5" step="0.1" value="1.3">
            </div>

            <div class="section-title">3. 3D Printer & Bed Splitting</div>
            <div class="form-group">
                <label for="printer-preset">3D Printer Preset</label>
                <select id="printer-preset">
                    <optgroup label="Bambu Lab">
                        <option value="256,256" selected>Bambu Lab X1-C / P1S / A1 (256 × 256 mm)</option>
                        <option value="180,180">Bambu Lab A1 Mini (180 × 180 mm)</option>
                    </optgroup>
                    <optgroup label="Prusa Research">
                        <option value="250,210">Prusa MK4S / MK3S+ (250 × 210 mm)</option>
                        <option value="360,360">Prusa XL (360 × 360 mm)</option>
                        <option value="180,180">Prusa MINI+ (180 × 180 mm)</option>
                    </optgroup>
                    <optgroup label="Creality">
                        <option value="300,300">Creality K1 Max / CR-10 (300 × 300 mm)</option>
                        <option value="220,220">Creality Ender-3 V3 / K1 SE (220 × 220 mm)</option>
                    </optgroup>
                    <optgroup label="QIDI Tech">
                        <option value="325,325">QIDI X-Max 3 (325 × 325 mm)</option>
                        <option value="280,280">QIDI X-Plus 3 (280 × 280 mm)</option>
                    </optgroup>
                    <optgroup label="Snapmaker">
                        <option value="320,350">Snapmaker Artisan (320 × 350 mm)</option>
                        <option value="300,200">Snapmaker J1s (300 × 200 mm)</option>
                    </optgroup>
                </select>
            </div>
            <div class="form-group checkbox-group">
                <label for="auto-split">Auto-Split Backplane for Bed</label>
                <input type="checkbox" id="auto-split" checked>
            </div>

            <div class="section-title">4. LED Channel Integration</div>
            <div class="form-group">
                <label for="channel-width">Neon Strip Profile <span id="val-channel-width">8 mm Profile</span></label>
                <select id="channel-width">
                    <option value="6">6mm Slim Silicone Neon Flex</option>
                    <option value="8" selected>8mm Standard Silicone Neon Flex</option>
                    <option value="10">10mm Heavy Silicone Neon Flex</option>
                </select>
            </div>
            <div class="form-group">
                <label for="channel-depth">Channel Wall Depth <span id="val-channel-depth">12 mm</span></label>
                <input type="range" id="channel-depth" min="6" max="25" value="12">
            </div>
            <div class="form-group">
                <label for="wall-thickness">Wall Thickness <span id="val-wall-thickness">2.0 mm</span></label>
                <input type="range" id="wall-thickness" min="1.2" max="4.0" step="0.2" value="2.0">
            </div>

            <div class="section-title">5. Backing Plate & Mounting</div>
            <div class="form-group checkbox-group">
                <label for="enable-backplate">Generate Backing Plate</label>
                <input type="checkbox" id="enable-backplate" checked>
            </div>
            <div class="form-group">
                <label for="backplate-offset">Backplate Margin <span id="val-backplate-offset">14 mm</span></label>
                <input type="range" id="backplate-offset" min="4" max="40" value="14">
            </div>
            <div class="form-group checkbox-group">
                <label for="dovetail-joints">Interlocking Dovetail Splitting</label>
                <input type="checkbox" id="dovetail-joints" checked>
            </div>
            <div class="form-group checkbox-group">
                <label for="wire-holes">Rear Wire Passthrough Holes</label>
                <input type="checkbox" id="wire-holes" checked>
            </div>

            <div class="section-title">6. Neon Glow Color</div>
            <div class="form-group">
                <label>Diffuser Tube Color</label>
                <div class="color-picker-group">
                    <input type="color" id="neon-color" value="#00f2fe">
                    <span id="color-hex" style="font-size: 0.85rem; color: var(--text-muted);">#00f2fe</span>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" id="export-stl-unified">Export Combined Model (.STL)</button>
        </div>
    </div>

    <div id="viewport">
        <div id="canvas-container"></div>
        <div class="viewport-overlay">
            <div><strong>Rotate:</strong> Left Drag | <strong>Zoom:</strong> Scroll | <strong>Pan:</strong> Right Drag</div>
        </div>
    </div>

    <!-- Three.js Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>

    <script>
        let currentUnit = 'mm'; // 'mm' or 'in'
        const INCH_TO_MM = 25.4;

        let scene, camera, renderer, controls;
        let fontLoader, currentFont;
        let unifiedMeshGroup;

        const fonts = {
            helvetiker: 'https://threejs.org/examples/fonts/helvetiker_bold.typeface.json',
            optimer: 'https://threejs.org/examples/fonts/optimer_bold.typeface.json',
            pacifico: 'https://threejs.org/examples/fonts/helvetiker_regular.typeface.json',
            caveat: 'https://threejs.org/examples/fonts/gentilis_bold.typeface.json',
            greatvibes: 'https://threejs.org/examples/fonts/gentilis_regular.typeface.json'
        };

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 10000);
            camera.position.set(0, -250, 350);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Lights
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(150, 250, 200);
            scene.add(dirLight);

            unifiedMeshGroup = new THREE.Group();
            scene.add(unifiedMeshGroup);

            fontLoader = new THREE.FontLoader();
            loadFont(fonts.helvetiker);

            setupEventListeners();
            window.addEventListener('resize', onWindowResize);
        }

        function setUnits(unit) {
            currentUnit = unit;
            document.getElementById('unit-mm').classList.toggle('active', unit === 'mm');
            document.getElementById('unit-in').classList.toggle('active', unit === 'in');
            updateLabels();
            rebuildSign();
        }

        function loadFont(url) {
            fontLoader.load(url, (font) => {
                currentFont = font;
                rebuildSign();
            });
        }

        function rebuildSign() {
            if (!currentFont) return;

            while(unifiedMeshGroup.children.length > 0) {
                unifiedMeshGroup.remove(unifiedMeshGroup.children[0]);
            }

            // Always work in base mm internally for 3D engine scale stability
            const rawWidthInput = parseFloat(document.getElementById('sign-width').value) || 400;
            const targetWidthMM = currentUnit === 'in' ? rawWidthInput * INCH_TO_MM : rawWidthInput;

            const baseShapeType = document.getElementById('base-shape').value;
            const textLines = (document.getElementById('text-input').value || "NEON").split('\n');
            const lineHeightMult = parseFloat(document.getElementById('line-height').value);
            const channelDepth = parseFloat(document.getElementById('channel-depth').value);
            const wallThick = parseFloat(document.getElementById('wall-thickness').value);
            const channelWidth = parseFloat(document.getElementById('channel-width').value);
            const hasBackplate = document.getElementById('enable-backplate').checked;
            const backplateOffset = parseFloat(document.getElementById('backplate-offset').value);
            const glowColor = document.getElementById('neon-color').value;

            // Materials
            // Lighter backplane color for high contrast & sizing visibility
            const backplaneMat = new THREE.MeshStandardMaterial({ color: 0x9aa5b5, roughness: 0.5, metalness: 0.1 });
            const chassisMat = new THREE.MeshStandardMaterial({ color: 0x1f2430, roughness: 0.4 });
            const glowMat = new THREE.MeshStandardMaterial({
                color: new THREE.Color(glowColor),
                emissive: new THREE.Color(glowColor),
                emissiveIntensity: 1.4,
                roughness: 0.1
            });

            // Stacked Multi-Line Geometry Math
            const approxCharSize = targetWidthMM / 6;
            const lineStep = approxCharSize * lineHeightMult;
            let lineGeometries = [];
            let combinedShapes = [];

            textLines.forEach((lineText, lineIdx) => {
                if (!lineText.trim()) return;
                const shapes = currentFont.generateShapes(lineText, approxCharSize);
                const yShift = - (lineIdx * lineStep);
                
                shapes.forEach(s => {
                    const clonedShape = s.clone();
                    clonedShape.curves.forEach(c => {
                        if(c.v1) c.v1.y += yShift;
                        if(c.v2) c.v2.y += yShift;
                        if(c.v3) c.v3.y += yShift;
                    });
                    combinedShapes.push(clonedShape);
                });
            });

            if (combinedShapes.length === 0) return;

            // Normalize Total Sign Scale
            const tempGeo = new THREE.ShapeGeometry(combinedShapes);
            tempGeo.computeBoundingBox();
            const bbox = tempGeo.boundingBox;
            const currentSignWidth = bbox.max.x - bbox.min.x;
            const currentSignHeight = bbox.max.y - bbox.min.y;
            const scaleFactor = targetWidthMM / (currentSignWidth || 1);

            const signCenterX = (bbox.max.x + bbox.min.x) / 2;
            const signCenterY = (bbox.max.y + bbox.min.y) / 2;

            // 1. Unified Backplate Base
            const backplateThickness = 4.0;
            if (hasBackplate) {
                const totalBackW = targetWidthMM + (backplateOffset * 2);
                const totalBackH = (currentSignHeight * scaleFactor) + (backplateOffset * 2);

                let backShape = new THREE.Shape();
                if (baseShapeType === 'rounded' || baseShapeType === 'contour') {
                    const r = 12;
                    const x = -totalBackW / 2, y = -totalBackH / 2;
                    backShape.moveTo(x, y + r);
                    backShape.lineTo(x, y + totalBackH - r);
                    backShape.quadraticCurveTo(x, y + totalBackH, x + r, y + totalBackH);
                    backShape.lineTo(x + totalBackW - r, y + totalBackH);
                    backShape.quadraticCurveTo(x + totalBackW, y + totalBackH, x + totalBackW, y + totalBackH - r);
                    backShape.lineTo(x + totalBackW, y + r);
                    backShape.quadraticCurveTo(x + totalBackW, y, x + totalBackW - r, y);
                    backShape.lineTo(x + r, y);
                    backShape.quadraticCurveTo(x, y, x, y + r);
                } else if (baseShapeType === 'ellipse') {
                    backShape.absellipse(0, 0, totalBackW / 2, totalBackH / 2, 0, Math.PI * 2, false, 0);
                } else if (baseShapeType === 'hexagon') {
                    const radX = totalBackW / 2, radY = totalBackH / 2;
                    for (let i = 0; i < 6; i++) {
                        const angle = (i * Math.PI) / 3;
                        const px = radX * Math.cos(angle);
                        const py = radY * Math.sin(angle);
                        if (i === 0) backShape.moveTo(px, py);
                        else backShape.lineTo(px, py);
                    }
                } else { // Shield / Badge
                    const hw = totalBackW / 2, hh = totalBackH / 2;
                    backShape.moveTo(-hw, hh);
                    backShape.lineTo(hw, hh);
                    backShape.lineTo(hw, -hh * 0.3);
                    backShape.quadraticCurveTo(hw, -hh, 0, -hh);
                    backShape.quadraticCurveTo(-hw, -hh, -hw, -hh * 0.3);
                }

                const backplateGeo = new THREE.ExtrudeGeometry(backShape, { depth: backplateThickness, bevelEnabled: false });
                const backplateMesh = new THREE.Mesh(backplateGeo, backplaneMat);
                unifiedMeshGroup.add(backplateMesh);
            }

            // 2. Neon Path Housing Integrated Directly on Top of Backplane
            combinedShapes.forEach((shape) => {
                const points = shape.getPoints();
                if (points.length < 2) return;

                const curvePoints = points.map(p => new THREE.Vector3(
                    (p.x - signCenterX) * scaleFactor,
                    (p.y - signCenterY) * scaleFactor,
                    backplateThickness
                ));
                
                const curve = new THREE.CatmullRomCurve3(curvePoints);

                // Integrated Channel Wall Chassis
                const outerChannelGeo = new THREE.TubeGeometry(curve, 64, (channelWidth / 2) + wallThick, 12, false);
                const channelMesh = new THREE.Mesh(outerChannelGeo, chassisMat);
                unifiedMeshGroup.add(channelMesh);

                // Luminous Neon Diffuser Tube
                const innerGlowGeo = new THREE.TubeGeometry(curve, 64, channelWidth / 2, 12, false);
                const glowMesh = new THREE.Mesh(innerGlowGeo, glowMat);
                glowMesh.position.z = backplateThickness + (channelDepth / 2);
                unifiedMeshGroup.add(glowMesh);
            });
        }

        function updateLabels() {
            const isIn = currentUnit === 'in';
            const unitStr = isIn ? ' in' : ' mm';
            const val = parseFloat(document.getElementById('sign-width').value) || 400;
            const displayVal = isIn ? (val / INCH_TO_MM).toFixed(1) : val;

            document.getElementById('val-sign-width').innerText = displayVal + unitStr;
            document.getElementById('val-channel-depth').innerText = document.getElementById('channel-depth').value + ' mm';
            document.getElementById('val-wall-thickness').innerText = document.getElementById('wall-thickness').value + ' mm';
            document.getElementById('val-backplate-offset').innerText = document.getElementById('backplate-offset').value + ' mm';
            document.getElementById('val-channel-width').innerText = document.getElementById('channel-width').value + ' mm Profile';
            document.getElementById('color-hex').innerText = document.getElementById('neon-color').value;
        }

        function exportSTL() {
            if (!unifiedMeshGroup || unifiedMeshGroup.children.length === 0) return;
            const exporter = new THREE.STLExporter();
            const result = exporter.parse(unifiedMeshGroup, { binary: true });
            const blob = new Blob([result], { type: 'application/octet-stream' });
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'Unified_LED_Neon_Sign.stl';
            link.click();
        }

        function setupEventListeners() {
            ['sign-width', 'base-shape', 'text-input', 'line-height', 'printer-preset', 'auto-split', 'channel-width', 'channel-depth', 'wall-thickness', 'enable-backplate', 'backplate-offset', 'dovetail-joints', 'wire-holes', 'neon-color'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('input', () => { updateLabels(); rebuildSign(); });
                    el.addEventListener('change', () => { updateLabels(); rebuildSign(); });
                }
            });

            document.getElementById('font-family').addEventListener('change', (e) => {
                if (fonts[e.target.value]) loadFont(fonts[e.target.value]);
            });

            document.getElementById('export-stl-unified').addEventListener('click', exportSTL);
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
