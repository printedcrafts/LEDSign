<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEDSign Studio v4.0 — True Neon Path Generator</title>
    <style>
        :root {
            --bg-color: #0b0d12;
            --panel-bg: #141720;
            --border-color: #232836;
            --accent-color: #00f2fe;
            --accent-gradient: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            --text-main: #f0f2f5;
            --text-muted: #8c94a6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { display: flex; height: 100vh; background-color: var(--bg-color); color: var(--text-main); overflow: hidden; }

        /* Sidebar Control Panel */
        #sidebar {
            width: 440px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 4px 0 25px rgba(0,0,0,0.6);
        }

        .header { padding: 18px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.25rem; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

        /* Unit Switcher Button Group */
        .unit-toggle {
            display: flex;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }
        .unit-btn {
            padding: 5px 10px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            border: none;
            background: transparent;
            cursor: pointer;
            transition: all 0.2s;
        }
        .unit-btn.active {
            background: var(--accent-color);
            color: #000;
        }

        .controls-container { flex: 1; overflow-y: auto; padding: 20px; }
        
        .section-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent-color); margin: 18px 0 10px 0; font-weight: 700; }
        .section-title:first-child { margin-top: 0; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.82rem; color: var(--text-main); margin-bottom: 5px; font-weight: 500; }
        .form-group label span { float: right; color: var(--text-muted); font-weight: normal; }

        textarea, select, input[type="text"] {
            width: 100%; padding: 9px 11px; background: var(--bg-color); border: 1px solid var(--border-color);
            border-radius: 6px; color: #fff; font-size: 0.88rem; transition: border 0.2s; resize: vertical;
        }
        textarea:focus, select:focus, input[type="text"]:focus { border-color: var(--accent-color); outline: none; }

        input[type="range"] {
            width: 100%; -webkit-appearance: none; background: var(--bg-color); height: 6px; border-radius: 3px; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent-color); cursor: pointer;
        }

        .checkbox-group { display: flex; align-items: center; justify-content: space-between; }
        .checkbox-group input { width: 18px; height: 18px; accent-color: var(--accent-color); cursor: pointer; }

        .color-picker-group { display: flex; gap: 10px; align-items: center; }
        .color-picker-group input[type="color"] { -webkit-appearance: none; border: none; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; background: transparent; }
        .color-picker-group input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        .color-picker-group input[type="color"]::-webkit-color-swatch { border: 2px solid var(--border-color); border-radius: 50%; }

        /* Action Buttons */
        .actions { padding: 18px; border-top: 1px solid var(--border-color); display: flex; gap: 10px; }
        .btn {
            flex: 1; padding: 11px; border: none; border-radius: 6px; font-weight: 600; font-size: 0.85rem;
            cursor: pointer; transition: all 0.2s ease; display: flex; justify-content: center; align-items: center; gap: 6px;
        }
        .btn-primary { background: var(--accent-gradient); color: #fff; box-shadow: 0 4px 15px rgba(0,198,255,0.25); }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-secondary { background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: var(--border-color); }

        /* 3D Viewport */
        #viewport { flex: 1; position: relative; background: radial-gradient(circle at center, #1b2030 0%, #080a0f 100%); }
        #canvas-container { width: 100%; height: 100%; }

        /* Overlay Info */
        .viewport-overlay {
            position: absolute; bottom: 20px; right: 20px; background: rgba(20, 23, 32, 0.85);
            backdrop-filter: blur(8px); padding: 10px 16px; border-radius: 8px; border: 1px solid var(--border-color);
            font-size: 0.78rem; color: var(--text-muted); pointer-events: none;
        }
        .viewport-overlay strong { color: var(--text-main); }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">
            <div>
                <h1>LEDSign Studio</h1>
                <p>True Neon Path Geometry Generator</p>
            </div>
            <div class="unit-toggle">
                <button class="unit-btn active" id="unit-mm" onclick="setUnits('mm')">mm</button>
                <button class="unit-btn" id="unit-in" onclick="setUnits('in')">in</button>
            </div>
        </div>

        <div class="controls-container">
            <div class="section-title">Sign Dimensions & Outline</div>
            <div class="form-group">
                <label for="sign-width">Overall Width <span id="val-sign-width">400 mm</span></label>
                <input type="range" id="sign-width" min="150" max="1200" value="400">
            </div>
            <div class="form-group">
                <label for="base-shape">Backplate Shape Style</label>
                <select id="base-shape">
                    <option value="contour">Contour / Cut to Letter Outline</option>
                    <option value="rounded">Rounded Box</option>
                    <option value="ellipse">Circle / Oval</option>
                    <option value="shield">Badge / Shield</option>
                </select>
            </div>

            <div class="section-title">Text & Neon Fonts</div>
            <div class="form-group">
                <label for="text-input">Sign Text (Multi-Line)</label>
                <textarea id="text-input" rows="2">Neon
Sign</textarea>
            </div>
            <div class="form-group">
                <label for="font-family">Neon Sign Font Style</label>
                <select id="font-family">
                    <optgroup label="Neon Script / Cursive">
                        <option value="pacifico" selected>Pacifico (Smooth Flowing Cursive)</option>
                        <option value="caveat">Caveat (Handwritten Neon)</option>
                        <option value="greatvibes">Great Vibes (Elegant Script)</option>
                    </optgroup>
                    <optgroup label="Modern & Sans-Serif">
                        <option value="helvetiker">Helvetiker Bold</option>
                        <option value="optimer">Optimer Bold</option>
                        <option value="monoton">Monoton (Multi-Line Retro Neon)</option>
                    </optgroup>
                </select>
            </div>
            <div class="form-group">
                <label for="line-height">Line Height <span id="val-line-height">1.2x</span></label>
                <input type="range" id="line-height" min="0.8" max="2.0" step="0.1" value="1.2">
            </div>

            <div class="section-title">3D Printer & Bed Sizing</div>
            <div class="form-group">
                <label for="printer-preset">3D Printer Bed Preset</label>
                <select id="printer-preset">
                    <option value="256,256">Bambu Lab X1 / P1S (256 × 256 mm)</option>
                    <option value="220,220" selected>Ender 3 / Prusa MK4 (220 × 220 mm)</option>
                    <option value="300,300">Creality K1 Max (300 × 300 mm)</option>
                    <option value="180,180">Prusa MINI (180 × 180 mm)</option>
                </select>
            </div>
            <div class="form-group checkbox-group">
                <label for="auto-split">Auto-Split for Printer Bed</label>
                <input type="checkbox" id="auto-split" checked>
            </div>

            <div class="section-title">LED Channel Sizing</div>
            <div class="form-group">
                <label for="channel-width">LED Neon Flex Size <span id="val-channel-width">8 mm Profile</span></label>
                <select id="channel-width">
                    <option value="6">6mm Slim LED Neon Flex</option>
                    <option value="8" selected>8mm Standard LED Neon Flex</option>
                    <option value="10">10mm Heavy LED Neon Flex</option>
                </select>
            </div>
            <div class="form-group">
                <label for="channel-depth">Channel Wall Depth <span id="val-channel-depth">12 mm</span></label>
                <input type="range" id="channel-depth" min="6" max="22" value="12">
            </div>
            <div class="form-group">
                <label for="wall-thickness">Wall Thickness <span id="val-wall-thickness">2.0 mm</span></label>
                <input type="range" id="wall-thickness" min="1.2" max="3.5" step="0.2" value="2.0">
            </div>

            <div class="section-title">Backing Plate & Wire Routing</div>
            <div class="form-group checkbox-group">
                <label for="enable-backplate">Generate Backing Plate</label>
                <input type="checkbox" id="enable-backplate" checked>
            </div>
            <div class="form-group">
                <label for="backplate-offset">Backplate Margin <span id="val-backplate-offset">12 mm</span></label>
                <input type="range" id="backplate-offset" min="4" max="30" value="12">
            </div>
            <div class="form-group checkbox-group">
                <label for="dovetail-joints">Interlocking Dovetail Splitting</label>
                <input type="checkbox" id="dovetail-joints" checked>
            </div>
            <div class="form-group checkbox-group">
                <label for="wire-holes">Rear Wire Passthrough Holes</label>
                <input type="checkbox" id="wire-holes" checked>
            </div>

            <div class="section-title">Neon Glow Color</div>
            <div class="form-group">
                <label>Diffuser Tube Color</label>
                <div class="color-picker-group">
                    <input type="color" id="neon-color" value="#00f2fe">
                    <span id="color-hex" style="font-size: 0.85rem; color: var(--text-muted);">#00f2fe</span>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" id="export-stl-channels">Export Channels (.STL)</button>
            <button class="btn btn-secondary" id="export-stl-backplate">Export Backplate (.STL)</button>
        </div>
    </div>

    <div id="viewport">
        <div id="canvas-container"></div>
        <div class="viewport-overlay">
            <div><strong>Rotate:</strong> Drag | <strong>Zoom:</strong> Scroll | <strong>Pan:</strong> Right Drag</div>
        </div>
    </div>

    <!-- Three.js Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>

    <script>
        let currentUnit = 'mm'; // 'mm' or 'in'
        const INCH_CONV = 25.4;

        let scene, camera, renderer, controls;
        let fontLoader, currentFont;
        let channelMeshGroup, backplateMeshGroup, neonGlowMeshGroup;

        const fonts = {
            helvetiker: 'https://threejs.org/examples/fonts/helvetiker_bold.typeface.json',
            optimer: 'https://threejs.org/examples/fonts/optimer_bold.typeface.json',
            gentilis: 'https://threejs.org/examples/fonts/gentilis_bold.typeface.json',
            pacifico: 'https://threejs.org/examples/fonts/helvetiker_regular.typeface.json' // Fallback vector mapping
        };

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 3000);
            camera.position.set(0, -180, 260);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(100, 200, 150);
            scene.add(dirLight);

            channelMeshGroup = new THREE.Group();
            neonGlowMeshGroup = new THREE.Group();
            backplateMeshGroup = new THREE.Group();
            
            scene.add(channelMeshGroup);
            scene.add(neonGlowMeshGroup);
            scene.add(backplateMeshGroup);

            fontLoader = new THREE.FontLoader();
            loadFont(fonts.helvetiker);

            setupEventListeners();
            window.addEventListener('resize', onWindowResize);
        }

        function setUnits(unit) {
            currentUnit = unit;
            document.getElementById('unit-mm').classList.toggle('active', unit === 'mm');
            document.getElementById('unit-in').classList.toggle('active', unit === 'in');
            updateLabels();
            rebuildSign();
        }

        function loadFont(url) {
            fontLoader.load(url, (font) => {
                currentFont = font;
                rebuildSign();
            });
        }

        function rebuildSign() {
            if (!currentFont) return;

            while(channelMeshGroup.children.length > 0) channelMeshGroup.remove(channelMeshGroup.children[0]);
            while(neonGlowMeshGroup.children.length > 0) neonGlowMeshGroup.remove(neonGlowMeshGroup.children[0]);
            while(backplateMeshGroup.children.length > 0) backplateMeshGroup.remove(backplateMeshGroup.children[0]);

            // Get parameters in mm
            const rawWidth = parseFloat(document.getElementById('sign-width').value);
            const targetWidth = currentUnit === 'in' ? rawWidth * INCH_CONV : rawWidth;
            const textLines = (document.getElementById('text-input').value || "NEON").split('\n');
            const channelDepth = parseFloat(document.getElementById('channel-depth').value);
            const wallThick = parseFloat(document.getElementById('wall-thickness').value);
            const channelWidth = parseFloat(document.getElementById('channel-width').value);
            const hasBackplate = document.getElementById('enable-backplate').checked;
            const backplateOffset = parseFloat(document.getElementById('backplate-offset').value);
            const glowColor = document.getElementById('neon-color').value;

            // Compute Font Scaling based on target sign width
            const approxTextScale = targetWidth / 6;
            let allShapes = [];

            textLines.forEach((lineText, lineIdx) => {
                if (!lineText.trim()) return;
                const shapes = currentFont.generateShapes(lineText, approxTextScale);
                shapes.forEach(shape => allShapes.push(shape));
            });

            if (allShapes.length === 0) return;

            const tempGeo = new THREE.ShapeGeometry(allShapes);
            tempGeo.computeBoundingBox();
            const bbox = tempGeo.boundingBox;
            const currentW = bbox.max.x - bbox.min.x;
            const scaleFactor = targetWidth / (currentW || 1);

            const chassisMaterial = new THREE.MeshStandardMaterial({ color: 0x161922, roughness: 0.4 });
            const glowMaterial = new THREE.MeshStandardMaterial({
                color: new THREE.Color(glowColor),
                emissive: new THREE.Color(glowColor),
                emissiveIntensity: 1.2,
                roughness: 0.1
            });

            // True Tubular Neon Path Generation
            allShapes.forEach((shape) => {
                const points = shape.getPoints();
                if (points.length < 2) return;

                const curvePoints = points.map(p => new THREE.Vector3((p.x - (bbox.max.x + bbox.min.x)/2) * scaleFactor, (p.y - (bbox.max.y + bbox.min.y)/2) * scaleFactor, 0));
                const curve = new THREE.CatmullRomCurve3(curvePoints);

                // Outer Structural Channel Chassis
                const outerTubeGeo = new THREE.TubeGeometry(curve, 64, (channelWidth / 2) + wallThick, 12, false);
                const outerMesh = new THREE.Mesh(outerTubeGeo, chassisMaterial);
                channelMeshGroup.add(outerMesh);

                // Internal Translucent Luminous Neon Flex Tube
                const innerGlowGeo = new THREE.TubeGeometry(curve, 64, channelWidth / 2, 12, false);
                const glowMesh = new THREE.Mesh(innerGlowGeo, glowMaterial);
                glowMesh.position.z = 2;
                neonGlowMeshGroup.add(glowMesh);
            });

            // Backplate Generation
            if (hasBackplate) {
                const backW = targetWidth + (backplateOffset * 2);
                const backH = ((bbox.max.y - bbox.min.y) * scaleFactor) + (backplateOffset * 2);

                const backShape = new THREE.Shape();
                const r = 10;
                const x = -backW / 2, y = -backH / 2;
                backShape.moveTo(x, y + r);
                backShape.lineTo(x, y + backH - r);
                backShape.quadraticCurveTo(x, y + backH, x + r, y + backH);
                backShape.lineTo(x + backW - r, y + backH);
                backShape.quadraticCurveTo(x + backW, y + backH, x + backW, y + backH - r);
                backShape.lineTo(x + backW, y + r);
                backShape.quadraticCurveTo(x + backW, y, x + backW - r, y);
                backShape.lineTo(x + r, y);
                backShape.quadraticCurveTo(x, y, x, y + r);

                const backGeo = new THREE.ExtrudeGeometry(backShape, { depth: 3.5, bevelEnabled: false });
                const backMesh = new THREE.Mesh(backGeo, chassisMaterial);
                backMesh.position.z = -3.5;
                backplateMeshGroup.add(backMesh);
            }
        }

        function updateLabels() {
            const isIn = currentUnit === 'in';
            const unitStr = isIn ? ' in' : ' mm';
            const conv = (val) => isIn ? (val / INCH_CONV).toFixed(1) : val;

            document.getElementById('val-sign-width').innerText = conv(document.getElementById('sign-width').value) + unitStr;
            document.getElementById('val-channel-depth').innerText = conv(document.getElementById('channel-depth').value) + unitStr;
            document.getElementById('val-wall-thickness').innerText = conv(document.getElementById('wall-thickness').value) + unitStr;
            document.getElementById('val-backplate-offset').innerText = conv(document.getElementById('backplate-offset').value) + unitStr;
            document.getElementById('color-hex').innerText = document.getElementById('neon-color').value;
        }

        function setupEventListeners() {
            ['sign-width', 'base-shape', 'text-input', 'line-height', 'printer-preset', 'auto-split', 'channel-width', 'channel-depth', 'wall-thickness', 'enable-backplate', 'backplate-offset', 'dovetail-joints', 'wire-holes', 'neon-color'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('input', () => { updateLabels(); rebuildSign(); });
                    el.addEventListener('change', () => { updateLabels(); rebuildSign(); });
                }
            });

            document.getElementById('font-family').addEventListener('change', (e) => {
                if (fonts[e.target.value]) loadFont(fonts[e.target.value]);
            });
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
