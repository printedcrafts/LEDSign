<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Printed Sign Designer</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <header class="header">
    <h1>3D Printed Sign Designer</h1>
    <p>Design, preview, and download printable sign files.</p>
  </header>

  <main class="layout">
    <section class="panel panel-left">
      <div class="group">
        <h2>Text & Font</h2>
        <label>
          <span>Sign text</span>
          <input id="textInput" type="text" placeholder="Enter your text" />
        </label>

        <label>
          <span>Font</span>
          <select id="fontSelect">
            <option value="builtin-sans">Sans (built-in)</option>
            <option value="builtin-script">Script (built-in)</option>
            <option value="custom">Custom font</option>
          </select>
        </label>

        <label>
          <span>Upload custom font (.ttf / .otf)</span>
          <input id="fontUpload" type="file" accept=".ttf,.otf" />
        </label>
      </div>

      <div class="group">
        <h2>LED Model</h2>
        <select id="ledProfile">
          <option value="WS2812B">WS2812B</option>
          <option value="WS2813">WS2813</option>
          <option value="SK6812">SK6812</option>
          <option value="WS2815">WS2815</option>
        </select>
      </div>

      <div class="group">
        <h2>Model</h2>
        <button id="generateModel">Generate Model</button>
      </div>

      <div class="group export-group">
        <h2>Export</h2>
        <button id="downloadStl">Download STL</button>
        <button id="downloadObj">Download OBJ</button>
      </div>
    </section>

    <section class="panel panel-right">
      <div id="previewContainer"></div>
    </section>
  </main>
</body>
</html>
