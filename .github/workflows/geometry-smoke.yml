name: LEDSign geometry smoke tests
on:
  push:
    branches:
      - main
      - feat/svg-channel-letter-studio
    paths:
      - "app.js"
      - "tests/**"
      - ".github/workflows/geometry-smoke.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app.js"
      - "tests/**"
      - ".github/workflows/geometry-smoke.yml"
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate application JavaScript syntax
        run: node --check app.js
      - name: Validate panel and connector geometry
        run: node tests/geometry-smoke.mjs
